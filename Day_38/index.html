<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Mobile Tab Navigation</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>
<body>

  <div class="phone">

    <img
      src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80"
      alt=""
      class="content show"
    >

    <img
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80"
      alt=""
      class="content"
    >

    <img
      src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1000&q=80"
      alt=""
      class="content"
    >

    <img
      src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=80"
      alt=""
      class="content"
    >

    <nav>
      <ul>

        <li class="active">
          <i class="fas fa-home"></i>
          <p>Home</p>
        </li>

        <li>
          <i class="fas fa-box"></i>
          <p>Work</p>
        </li>

        <li>
          <i class="fas fa-book-open"></i>
          <p>Blog</p>
        </li>

        <li>
          <i class="fas fa-users"></i>
          <p>About Us</p>
        </li>

      </ul>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>

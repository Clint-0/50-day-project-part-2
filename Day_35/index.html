<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Image Carousel</title>
</head>
<body>

  <div class="carousel">

    <div class="image-container" id="imgs">

      <img
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80"
        alt="image"
      >

      <img
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80"
        alt="image"
      >

      <img
        src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1000&q=80"
        alt="image"
      >

      <img
        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=80"
        alt="image"
      >

    </div>

    <div class="buttons-container">
      <button id="left">Prev</button>
      <button id="right">Next</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
